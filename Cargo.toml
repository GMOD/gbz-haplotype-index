[package]
name = "gbz-haplotype-index"
version = "0.3.0"
edition = "2021"
description = "Writes a companion haplotype index that names every walk in a gbz-base pangenome database"
license = "MIT"
repository = "https://github.com/GMOD/gbz-haplotype-index"
homepage = "https://github.com/GMOD/gbz-haplotype-index/blob/main/docs/haplotype-index.md"
readme = "README.md"
keywords = ["pangenome", "gbz", "gbwt", "haplotype", "bioinformatics"]
categories = ["science", "command-line-utilities"]

[dependencies]
gbz = "0.7"
simple-sds = "0.4"
gbz-base = "0.6.1"
rusqlite = { version = "0.38", features = ["bundled"] }

[profile.release]
opt-level = 3
