[package]
name = "gbz-haplotype-index"
version = "0.1.0"
edition = "2021"
description = "Adds HaplotypeSamples and HaplotypeLengths tables to a gbz-base database so every haplotype path can be identified and placed"
license = "MIT"

[dependencies]
gbz = "0.7"
simple-sds = "0.4"
rusqlite = { version = "0.38", features = ["bundled"] }

[profile.release]
opt-level = 3
