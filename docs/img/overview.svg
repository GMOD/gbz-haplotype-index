<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Helvetica, Arial, sans-serif" font-size="11">
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#57606a"/></marker><marker id="g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1a7f37"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="20" y="78" width="150" height="54" fill="#f6f8fa" stroke="#57606a" rx="4"/>
<text x="95" y="100" fill="#24292f" text-anchor="middle" font-weight="bold">graph.gbz</text>
<text x="95" y="118" fill="#57606a" text-anchor="middle" font-size="10">the pangenome graph</text>
<rect x="290" y="24" width="190" height="54" fill="#f6f8fa" stroke="#57606a" rx="4"/>
<text x="385" y="46" fill="#24292f" text-anchor="middle" font-weight="bold">graph.gbz.db</text>
<text x="385" y="64" fill="#57606a" text-anchor="middle" font-size="10">nodes, edges and walks, in SQLite</text>
<rect x="290" y="134" width="190" height="54" fill="#dafbe1" stroke="#1a7f37" rx="4"/>
<text x="385" y="156" fill="#1a7f37" text-anchor="middle" font-weight="bold">graph.haplotype-index.db</text>
<text x="385" y="174" fill="#1a7f37" text-anchor="middle" font-size="10">the haplotype of each walk, in SQLite</text>
<path d="M170,96 C230,96 230,51 288,51" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="230" y="62" fill="#57606a" text-anchor="middle" font-size="10" font-family="monospace">gbz-base</text>
<text x="230" y="74" fill="#57606a" text-anchor="middle" font-size="10" font-family="monospace">construct</text>
<path d="M170,114 C230,114 230,161 288,161" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#g)"/>
<path d="M385,78 L385,132" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#g)"/>
<text x="230" y="190" fill="#1a7f37" text-anchor="middle" font-size="10" font-family="monospace" font-weight="bold">gbz-haplotype-index</text>
<text x="230" y="203" fill="#1a7f37" text-anchor="middle" font-size="10">this repository</text>
<rect x="590" y="78" width="150" height="54" fill="#f6f8fa" stroke="#57606a" rx="4"/>
<text x="665" y="100" fill="#24292f" text-anchor="middle" font-weight="bold">@gmod/gbz-base</text>
<text x="665" y="118" fill="#57606a" text-anchor="middle" font-size="10">reads both over HTTP</text>
<path d="M480,51 C540,51 540,96 588,96" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M480,161 C540,161 540,114 588,114" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#g)"/>
<line x1="20" y1="230" x2="740" y2="230" stroke="#d0d7de"/>
<text x="20" y="254" fill="#24292f" font-weight="bold">Walks that a query of GRCh38#0#chr6:33,000,000-33,010,000 returns</text>
<rect x="20" y="266" width="350" height="104" fill="#f6f8fa" stroke="#d0d7de" rx="4"/>
<text x="32" y="286" fill="#57606a" font-size="10">graph.gbz.db alone</text>
<text x="32" y="306" fill="#24292f" font-family="monospace">GRCh38#0#chr6</text>
<text x="32" y="322" fill="#cf222e" font-family="monospace">unknown#1#chr6</text>
<text x="32" y="338" fill="#cf222e" font-family="monospace">unknown#2#chr6</text>
<text x="32" y="354" fill="#cf222e" font-family="monospace">unknown#3#chr6 ...</text>
<rect x="390" y="266" width="350" height="104" fill="#dafbe1" stroke="#1a7f37" rx="4"/>
<text x="402" y="286" fill="#1a7f37" font-size="10">with the haplotype index</text>
<text x="402" y="306" fill="#24292f" font-family="monospace">GRCh38#0#chr6</text>
<text x="402" y="322" fill="#1a7f37" font-family="monospace">HG002#1#chr6<tspan x="560">32,861,407</tspan></text>
<text x="402" y="338" fill="#1a7f37" font-family="monospace">HG002#2#chr6<tspan x="560">32,904,118</tspan></text>
<text x="402" y="354" fill="#1a7f37" font-family="monospace">HG00733#1#chr6<tspan x="560">32,877,560 ...</tspan></text>
<text x="20" y="390" fill="#57606a" font-size="10">Each named walk carries its sample, haplotype, contig and start along that contig. The coordinates above are illustrative.</text>
</svg>
