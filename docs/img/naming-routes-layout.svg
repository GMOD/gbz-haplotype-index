<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 828" font-family="Helvetica, Arial, sans-serif" font-size="11">
<defs><marker id="t" viewBox="0 0 2 10" refX="1" refY="5" markerWidth="2" markerHeight="10" orient="auto"><rect width="2" height="10" fill="#57606a"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="28" fill="#24292f" font-weight="bold">Sampled route</text>
<text x="20" y="46" fill="#24292f">A query that does not use the keep option extracts every walk through the window, then follows each walk to a sample to identify it.</text>
<text x="20" y="62" fill="#24292f">The cost grows with the number of haplotypes in the window, 464 in HPRC v2.1.</text>
<rect x="20" y="72" width="590" height="34" fill="#fff8c5" stroke="#9a6700" rx="3"/>
<text x="28" y="86" font-family="Courier, monospace" font-size="10" fill="#24292f">db.getAlignmentsForRange('GRCh38#0#chr6', start, end)</text>
<text x="28" y="100" font-family="Courier, monospace" font-size="10" fill="#24292f">gbz-base-query ... --alignments</text>

<rect x="360" y="120" width="160" height="126" fill="#fff8c5" stroke="#9a6700" stroke-dasharray="3 3" rx="3"/>
<text x="440" y="260" text-anchor="middle" fill="#9a6700">window</text>
<line x1="170" y1="132" x2="590" y2="132" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="170" y1="150" x2="590" y2="150" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="170" y1="168" x2="590" y2="168" stroke="#d0d7de" stroke-width="1.5"/>
