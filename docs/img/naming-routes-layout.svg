<line x1="170" y1="204" x2="590" y2="204" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="170" y1="230" x2="590" y2="230" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="360" y1="132" x2="520" y2="132" stroke="#57606a" stroke-width="1.5"/>
<line x1="360" y1="150" x2="520" y2="150" stroke="#57606a" stroke-width="1.5"/>
<line x1="360" y1="168" x2="520" y2="168" stroke="#57606a" stroke-width="1.5"/>
<line x1="360" y1="186" x2="520" y2="186" stroke="#57606a" stroke-width="1.5"/>
<line x1="360" y1="204" x2="520" y2="204" stroke="#57606a" stroke-width="1.5"/>
<line x1="520" y1="204" x2="566" y2="204" stroke="#57606a" stroke-width="1.5" stroke-dasharray="3 3"/>
<line x1="360" y1="230" x2="520" y2="230" stroke="#57606a" stroke-width="3"/>
<circle cx="396" cy="132" r="4" fill="#1a7f37"/>
<circle cx="486" cy="150" r="4" fill="#1a7f37"/>
<circle cx="430" cy="168" r="4" fill="#1a7f37"/>
<circle cx="466" cy="186" r="4" fill="#1a7f37"/>
<circle cx="566" cy="204" r="4" fill="#1a7f37"/>
<text x="160" y="234" fill="#57606a" text-anchor="end">reference</text>
<text x="600" y="136" fill="#1a7f37">HG002#1</text>
<text x="600" y="154" fill="#1a7f37">HG00733#2</text>
<text x="600" y="172" fill="#1a7f37">NA19240#1</text>
<text x="600" y="190" fill="#1a7f37">HG002#2</text>
<text x="600" y="208" fill="#1a7f37">HG01978#1</text>
<text x="600" y="222" fill="#57606a" font-size="10">no sample in the window, so the</text>
<text x="600" y="234" fill="#57606a" font-size="10">query follows the walk past it</text>
<text x="600" y="246" fill="#57606a" font-size="10">to the next sample</text>

<text x="20" y="296" fill="#24292f" font-weight="bold">Keep route</text>
<text x="20" y="314" fill="#24292f">A query that uses the keep option, <tspan font-family="Courier, monospace" font-size="10">{ keep: name =&gt; … }</tspan> or <tspan font-family="Courier, monospace" font-size="10">--keep NAME</tspan>, reads the rows at the anchor nodes around the window,</text>
<text x="20" y="330" fill="#24292f">which list every haplotype passing them, then follows the walks whose name the predicate accepts from one anchor to the next.</text>
<text x="20" y="346" fill="#24292f">The cost grows with the number of haplotypes chosen.</text>
<g transform="translate(0 16)">
<rect x="20" y="340" width="590" height="34" fill="#fff8c5" stroke="#9a6700" rx="3"/>
<text x="28" y="354" font-family="Courier, monospace" font-size="10" fill="#24292f">db.getAlignmentsForRange('GRCh38#0#chr6', start, end, { keep: name => name.sample === 'HG002' })</text>
<text x="28" y="368" font-family="Courier, monospace" font-size="10" fill="#24292f">gbz-base-query ... --alignments --keep HG002</text>

</g>

<text x="20" y="412" fill="#24292f">When it built the haplotype index, gbz-haplotype-index chose one anchor per multiple k of 131,072 bp along GRCh38#0#chr6: the</text>
<text x="20" y="428" fill="#24292f">node with the most GBWT positions in the half spacing before k × 131,072. A window at 33,000,000 lies between the anchors for</text>
<text x="20" y="444" fill="#24292f">k = 252 and k = 253, so the query follows each chosen haplotype from its visit to the first to its visit to the second.</text>
<rect x="42.2" y="500" width="59.4" height="16" fill="#eaeef2"/>
<rect x="161.1" y="500" width="59.4" height="16" fill="#eaeef2"/>
