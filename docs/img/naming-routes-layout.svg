<line x1="101.7" y1="496" x2="101.7" y2="520" stroke="#57606a"/>
<text x="101.7" y="482" fill="#57606a" font-size="10" text-anchor="middle">k = 250</text>
<text x="101.7" y="494" fill="#57606a" font-size="9" text-anchor="middle">32,768,000</text>
