<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 636" font-family="Helvetica, Arial, sans-serif" font-size="11">
<defs><marker id="t" viewBox="0 0 2 10" refX="1" refY="5" markerWidth="2" markerHeight="10" orient="auto"><rect width="2" height="10" fill="#57606a"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="28" fill="#24292f" font-weight="bold">Sampled route</text>
<text x="20" y="46" fill="#24292f">A query without <tspan font-family="Courier, monospace" font-size="10">{ keep }</tspan> or <tspan font-family="Courier, monospace" font-size="10">--keep</tspan> extracts every walk through the window, then follows each walk to a sample to identify it.</text>
<text x="20" y="62" fill="#24292f">The cost grows with the number of haplotypes in the window, 464 in HPRC v2.1.</text>
<rect x="20" y="72" width="590" height="34" fill="#fff8c5" stroke="#9a6700" rx="3"/>
<text x="28" y="86" font-family="Courier, monospace" font-size="10" fill="#24292f">db.getAlignmentsForRange('GRCh38#0#chr6', start, end)</text>
<text x="28" y="100" font-family="Courier, monospace" font-size="10" fill="#24292f">gbz-base-query ... --alignments</text>

<rect x="360" y="120" width="160" height="126" fill="#fff8c5" stroke="#9a6700" stroke-dasharray="3 3" rx="3"/>
<text x="440" y="260" text-anchor="middle" fill="#9a6700">window</text>
<line x1="170" y1="132" x2="590" y2="132" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="170" y1="150" x2="590" y2="150" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="170" y1="168" x2="590" y2="168" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="170" y1="186" x2="590" y2="186" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="170" y1="204" x2="590" y2="204" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="170" y1="230" x2="590" y2="230" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="360" y1="132" x2="520" y2="132" stroke="#57606a" stroke-width="1.5"/>
<line x1="360" y1="150" x2="520" y2="150" stroke="#57606a" stroke-width="1.5"/>
<line x1="360" y1="168" x2="520" y2="168" stroke="#57606a" stroke-width="1.5"/>
<line x1="360" y1="186" x2="520" y2="186" stroke="#57606a" stroke-width="1.5"/>
<line x1="360" y1="204" x2="520" y2="204" stroke="#57606a" stroke-width="1.5"/>
<line x1="520" y1="204" x2="566" y2="204" stroke="#57606a" stroke-width="1.5" stroke-dasharray="3 3"/>
<line x1="360" y1="230" x2="520" y2="230" stroke="#57606a" stroke-width="3"/>
<circle cx="396" cy="132" r="4" fill="#1a7f37"/>
<circle cx="486" cy="150" r="4" fill="#1a7f37"/>
<circle cx="430" cy="168" r="4" fill="#1a7f37"/>
<circle cx="466" cy="186" r="4" fill="#1a7f37"/>
<circle cx="566" cy="204" r="4" fill="#1a7f37"/>
<text x="160" y="234" fill="#57606a" text-anchor="end">reference</text>
<text x="600" y="136" fill="#1a7f37">HG002#1</text>
<text x="600" y="154" fill="#1a7f37">HG00733#2</text>
<text x="600" y="172" fill="#1a7f37">NA19240#1</text>
<text x="600" y="190" fill="#1a7f37">HG002#2</text>
<text x="600" y="208" fill="#1a7f37">HG01978#1</text>
<text x="600" y="222" fill="#57606a" font-size="10">no sample in the window, so the</text>
<text x="600" y="234" fill="#57606a" font-size="10">query follows the walk past it</text>
<text x="600" y="246" fill="#57606a" font-size="10">to the next sample</text>

<text x="20" y="296" fill="#24292f" font-weight="bold">Anchored route</text>
<text x="20" y="314" fill="#24292f">A query with <tspan font-family="Courier, monospace" font-size="10">{ keep: name =&gt; … }</tspan> or <tspan font-family="Courier, monospace" font-size="10">--keep NAME</tspan> reads the samples at one anchor node, which list every haplotype</text>
<text x="20" y="330" fill="#24292f">passing it, then follows the walks whose name the predicate accepts. The cost grows with the number of haplotypes chosen,</text>
<text x="20" y="346" fill="#24292f">and the query never reads the other walks.</text>
<g transform="translate(0 16)">
<rect x="20" y="340" width="590" height="34" fill="#fff8c5" stroke="#9a6700" rx="3"/>
<text x="28" y="354" font-family="Courier, monospace" font-size="10" fill="#24292f">db.getAlignmentsForRange('GRCh38#0#chr6', start, end, { keep: name => name.sample === 'HG002' })</text>
<text x="28" y="368" font-family="Courier, monospace" font-size="10" fill="#24292f">gbz-base-query ... --alignments --keep HG002</text>

<rect x="360" y="388" width="160" height="126" fill="#fff8c5" stroke="#9a6700" stroke-dasharray="3 3" rx="3"/>
<text x="440" y="528" text-anchor="middle" fill="#9a6700">window</text>
<line x1="186" y1="400" x2="590" y2="400" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="186" y1="418" x2="590" y2="418" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="186" y1="436" x2="590" y2="436" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="186" y1="454" x2="590" y2="454" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="186" y1="472" x2="590" y2="472" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="186" y1="498" x2="590" y2="498" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="200" y1="498" x2="528" y2="498" stroke="#57606a" stroke-width="3"/>
<line x1="200" y1="400" x2="520" y2="400" stroke="#0969da" stroke-width="2.5"/>
<polygon points="520,396 528,400 520,404" fill="#0969da"/>
<line x1="200" y1="454" x2="520" y2="454" stroke="#0969da" stroke-width="2.5"/>
<polygon points="520,450 528,454 520,458" fill="#0969da"/>
<rect x="192" y="390" width="16" height="124" fill="#dafbe1" stroke="#1a7f37" rx="3"/>
<circle cx="200" cy="400" r="3.5" fill="#1a7f37"/>
<circle cx="200" cy="418" r="3.5" fill="#1a7f37"/>
<circle cx="200" cy="436" r="3.5" fill="#1a7f37"/>
<circle cx="200" cy="454" r="3.5" fill="#1a7f37"/>
<circle cx="200" cy="472" r="3.5" fill="#1a7f37"/>
<circle cx="200" cy="498" r="3.5" fill="#1a7f37"/>
<text x="180" y="404" fill="#0969da" text-anchor="end">HG002#1</text>
<text x="180" y="422" fill="#8c959f" text-anchor="end">HG00733#2</text>
<text x="180" y="440" fill="#8c959f" text-anchor="end">NA19240#1</text>
<text x="180" y="458" fill="#0969da" text-anchor="end">HG002#2</text>
<text x="180" y="476" fill="#8c959f" text-anchor="end">HG01978#1</text>
<text x="180" y="502" fill="#57606a" text-anchor="end">reference</text>
<text x="600" y="404" fill="#0969da">chosen, so followed</text>
<text x="600" y="422" fill="#8c959f">not chosen, so not read</text>
<text x="200" y="528" fill="#1a7f37" text-anchor="middle">anchor node</text>
<line x1="200" y1="546" x2="360" y2="546" stroke="#57606a" marker-start="url(#t)" marker-end="url(#t)"/>
<text x="280" y="564" fill="#57606a" text-anchor="middle">The query walks the reference from the anchor to the window, a distance under 1.5 × --anchor-spacing.</text>

<rect x="20" y="576" width="720" height="38" fill="#ffffff" stroke="#d0d7de" rx="4"/>
<line x1="32" y1="590" x2="56" y2="590" stroke="#57606a" stroke-width="1.5"/>
<text x="66" y="594" fill="#57606a" font-size="10">walk read from graph.gbz.db</text>
<line x1="32" y1="606" x2="56" y2="606" stroke="#d0d7de" stroke-width="1.5"/>
<text x="66" y="610" fill="#57606a" font-size="10">walk in the graph that the query does not read</text>
<circle cx="316" cy="590" r="4" fill="#1a7f37"/>
<rect x="326" y="583" width="8" height="14" fill="#dafbe1" stroke="#1a7f37" rx="2"/>
<text x="344" y="594" fill="#1a7f37" font-size="10">sample, and anchor node, read from graph.haplotype-index.db</text>
<line x1="310" y1="606" x2="334" y2="606" stroke="#0969da" stroke-width="2.5"/>
<text x="344" y="610" fill="#0969da" font-size="10">chosen walk, followed from the anchor through the window</text>
</g>
</svg>
