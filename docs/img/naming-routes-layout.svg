<text x="339.3" y="494" fill="#57606a" font-size="9" text-anchor="middle">33,030,144</text>
<line x1="458.2" y1="496" x2="458.2" y2="520" stroke="#57606a"/>
<text x="458.2" y="482" fill="#57606a" font-size="10" text-anchor="middle">k = 253</text>
<text x="458.2" y="494" fill="#57606a" font-size="9" text-anchor="middle">33,161,216</text>
<line x1="577.0" y1="496" x2="577.0" y2="520" stroke="#57606a"/>
<text x="577.0" y="482" fill="#57606a" font-size="10" text-anchor="middle">k = 254</text>
<text x="577.0" y="494" fill="#57606a" font-size="9" text-anchor="middle">33,292,288</text>
<line x1="695.8" y1="496" x2="695.8" y2="520" stroke="#57606a"/>
<text x="695.8" y="482" fill="#57606a" font-size="10" text-anchor="middle">k = 255</text>
<text x="695.8" y="494" fill="#57606a" font-size="9" text-anchor="middle">33,423,360</text>
